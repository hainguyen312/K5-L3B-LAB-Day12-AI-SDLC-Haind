<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — nhóm Haind</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (nhóm Haind, Phase 2). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Màn hình: menu chính, DayIntro, EveningIntro, DayResult, Shop, Summary, menu pause.
 * Phím: WASD / mũi tên di chuyển · E tương tác · Space bắt cá · Esc/P tạm dừng · Shop: 1 Bình oxy, 2 Áo phao, Enter xong.
 * Mọi chữ dùng font không chân ≥ 18 px (Ticket-02 mục 2 "HUD").
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, menuSel = 0, pauseSel = 0, quit = false;

const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const UPG = { oxygen: ["Bình oxy", "oxygen_max_s", "s oxy"], hp: ["Áo phao", "hp_max", " Máu"] };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dn = (d) => DISH_NAME[d] || d;
const ui = () => (snap && snap.ui) || {};
const phase = () => (snap ? (snap.mode === "day" ? snap.phase : snap.mode) : "gather");

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
function currentInput() {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phase() === "quan") dy = -dy;                             // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function post(path, obj) {
  queue.push([path, obj === undefined ? "{}" : JSON.stringify(obj)]);
  flush();
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(["/input", s]);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const [path, body] = queue.shift();
    try { await fetch(path, { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) { /* poll báo mất kết nối */ }
  }
  inflight = false;
}
const keyName = (e) => e.key.toLowerCase();
function onScreenKey(k) {
  const scr = ui().screen;
  if (scr === "menu") {
    if (k === "arrowup" || k === "w" || k === "arrowdown" || k === "s") menuSel = 1 - menuSel;
    else if (k === "enter" || k === " " || k === "e") menuSel === 0 ? post("/continue") : doQuit();
    return true;
  }
  if (scr === "summary") { if (k === "r" || k === "enter") restart(); return true; }
  if (scr) { post("/continue"); return true; }
  return false;
}
function restart() { post("/restart"); lastSent = ""; down.clear(); menuSel = 0; }
function doQuit() { quit = true; post("/quit"); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  if (onScreenKey(k)) return;
  const paused = snap && snap.state === "paused";
  if (k === "escape" || k === "p") { down.add("pause"); pushInput(); return; }
  if (paused) {
    if (k === "arrowup" || k === "arrowdown" || k === "w" || k === "s") pauseSel = 1 - pauseSel;
    else if (k === "enter" || k === "e") { if (pauseSel === 0) { down.add("pause"); pushInput(); down.delete("pause"); pushInput(); } else restart(); }
    else if (k === "m") restart();
    return;
  }
  if (phase() === "shop") {
    if (k === "1") post("/input", { buy: "oxygen" });
    else if (k === "2") post("/input", { buy: "hp" });
    else if (k === "enter") down.add("shop_done");
    pushInput();
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "r" && snap && snap.mode !== "day") restart();
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  if (quit) return;
  try { const r = await fetch("/state", { cache: "no-store" }); snap = await r.json(); offline = false; }
  catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- tiện ích vẽ ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "700 " : "") + Math.max(18, o.size || 18) + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 4, { align: "center", color: "#10161c", bold: true });
}
function panel(x, y, w, h, a = 0.72) { ctx.fillStyle = `rgba(16,22,28,${a})`; ctx.fillRect(x, y, w, h); ctx.strokeStyle = "rgba(244,196,48,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); }
function fmtTime(ticks) { const s = Math.ceil(ticks / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
const blink = () => Math.floor(performance.now() / 300) % 2 === 0;
function counts(arr) { const c = {}; (arr || []).forEach((k) => (c[k] = (c[k] || 0) + 1)); return c; }
function items(obj) { return Object.keys(obj || {}).filter((k) => obj[k] > 0).map((k) => kn(k) + " ×" + obj[k]).join(", ") || "(trống)"; }

// ---------- cảnh GATHER ----------
function drawGather(w, h) {
  const meta = snap.meta || {}, b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6, top = 96, bottom = 92;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = "#f3c9a8"; ctx.fillRect(0, top, w, SKY * s);                 // ánh hồng buổi sớm
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#b98a4e"); g.addColorStop(0.45, "#8c6431"); g.addColorStop(1, "#2e1f10");   // nước phù sa
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  [10, 20].forEach((d) => { ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke(); });
  const p = snap.player;
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#6b4a2b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.strokeStyle = "rgba(255,230,150,.6)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  (snap.nodes || []).forEach((n) => {
    ctx.globalAlpha = n.ready ? 1 : 0.3; ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  });
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate((f.heading_deg * Math.PI) / 180); ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill(); ctx.restore();
  });
  let danger = false;
  (snap.monsters || []).forEach((m) => {
    const near = p && Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) <= 12;
    danger = danger || m.state === "chase" || (near && p.pos[1] >= 10);
    ctx.fillStyle = m.state === "recoil" ? "#a58bd0" : "#8a5cc2";
    ctx.beginPath(); ctx.ellipse(sx(m.pos[0]), sy(m.pos[1]), 1.6 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(sx(m.pos[0] + 1), sy(m.pos[1] - 0.2), 0.15 * s, 0, Math.PI * 2); ctx.fill();
  });
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (!(p.invuln_ticks > 0 && blink())) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = (p.heading_deg * Math.PI) / 180; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  if (danger) { ctx.strokeStyle = "#8a5cc2"; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10); ctx.lineWidth = 1; }
  // HUD trên: thời gian, oxy, Máu, độ sâu, hồi bắt
  panel(0, 0, w, 88, 0.8);
  const tl = snap.time_left_ticks;
  text("⏱ " + fmtTime(tl), 16, 34, { size: 26, bold: true, color: tl <= 1800 ? "#ff5a5f" : "#fff7e8" });
  if (p) {
    const frac = p.oxygen_ticks / p.oxygen_max_ticks, low = frac < 0.25;
    bar(140, 12, 260, 28, frac, low ? (blink() ? "#ff5a5f" : "#7a1f22") : "#bfe6f2", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 420, 36, { size: 26, color: "#ff6b81" });
    text("Độ sâu " + p.pos[1].toFixed(1) + " m", 16, 72);
    text(p.catch_cd_ticks > 0 ? "Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s" : "Bắt cá: sẵn sàng", 200, 72, { color: p.catch_cd_ticks > 0 ? "#cdbfa6" : "#5bbf6a" });
  }
  text(`Tiền ${snap.money}k · uy tín ${snap.reputation.toFixed(1)}` + (snap.day ? ` · Ngày ${snap.day}` : ""), w - 16, 34, { align: "right" });
  // danh sách cần lấy (đã lấy / cần)
  const got = counts(snap.hold);
  if (snap.day_plan) {
    const need = snap.day_plan.ingredients;
    const parts = Object.keys(need).map((k) => `${kn(k)} ${got[k] || 0}/${need[k]}`);
    text("Cần lấy: " + parts.join(" · "), w - 16, 72, { align: "right", color: "#f4c430" });
  }
  // gợi ý + cảnh báo
  if (p) {
    const surf = p.at_surface;
    const nearNode = surf && (snap.nodes || []).some((n) => n.ready && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= (meta.interact_radius || 2));
    const nearDock = Math.hypot(dp[0] - p.pos[0], dp[1] - p.pos[1]) <= dr;
    const hint = nearDock ? "E: cập bến, mở quán" : nearNode ? "E: hái" : "";
    if (hint) text(hint, w / 2, top + 28, { align: "center", size: 22, bold: true, color: "#2b2118" });
    if (p.oxygen_ticks === 0 && !surf) text("Hết hơi!", w / 2, h / 2 - 40, { align: "center", size: 36, bold: true, color: blink() ? "#ff5a5f" : "#fff" });
    if (danger) text("Thủy quái!", w / 2, h / 2, { align: "center", size: 36, bold: true, color: "#c9a6ff" });
  }
  // giỏ theo loại
  panel(0, h - bottom + 20, w, bottom - 20, 0.8);
  const cap = snap.hold_capacity, sz = 26;
  for (let i = 0; i < cap; i++) {
    const x0 = 16 + i * (sz + 4), y0 = h - bottom + 30;
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
    if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
  }
  text(`Giỏ ${snap.hold.length}/${cap}: ${items(got)}`, 16 + cap * (sz + 4) + 10, h - bottom + 50);
  text("WASD bơi · E hái/cập bến · Space bắt cá · Esc tạm dừng", w - 16, h - 12, { align: "right", color: "#cdbfa6" });
}

// ---------- cảnh QUÁN ----------
function drawQuan(w, h) {
  const meta = snap.meta || {}, b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 96, bottom = 60;
  const s = Math.max(1, Math.min((w - 380) / X, (h - top - bottom) / Z));
  const ox = 20, oy = top, sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#3a2a1a"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? "#f4c430" : "#ffe08a"; ctx.beginPath(); ctx.arc(sx((i + 0.5) * X / 12), sy(Z) + 6, 4, 0, Math.PI * 2); ctx.fill(); }  // đèn dây
  const patMax = (meta.patience_s || 60) * 60;
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#5bbf6a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 7, { align: "center", color: "#111", bold: true });
    if (st.state === "cooking" && st.dish) {
      const total = Math.round(((meta.menu || {})[st.dish.dish_id] || { cook_s: 1 }).cook_s * 60);
      bar(sx(st.pos[0]) - 0.9 * s, sy(st.pos[1]) + 0.95 * s, 1.8 * s, 20, 1 - st.cook_ticks_left / total, "#e8892b");
    }
    if (st.state === "ready") text("Chín!", sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { align: "center", bold: true, color: "#5bbf6a" });
  });
  const byTable = {}; (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 7, { align: "center" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.4 * s;
      ctx.fillStyle = c.state === "eating" ? "#5bbf6a" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.5 * s, 0, Math.PI * 2); ctx.fill();
      if (c.state === "waiting") {
        const frac = c.patience_ticks_left / patMax;
        bar(cx - 0.9 * s, cy + 0.55 * s, 1.8 * s, 14, frac, frac < 0.25 ? "#ff5a5f" : "#f4c430");
      }
    }
  });
  const p = snap.player;
  if (p) { ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(sx(p.pos[0]), sy(p.pos[1]), 0.45 * s, 0, Math.PI * 2); ctx.fill(); }
  // HUD trên
  panel(0, 0, w, 88, 0.8);
  text("⏱ Ca tối " + fmtTime(snap.time_left_ticks), 16, 34, { size: 26, bold: true, color: snap.time_left_ticks <= 1800 ? "#ff5a5f" : "#fff7e8" });
  const ds = ((ui().stats && ui().stats.days) || []).slice(-1)[0];
  const shift = snap.mode === "day" && ds ? ds.shift_money : snap.money;
  text(`Tiền ca ${shift}k · tổng ${snap.money}k · uy tín ${snap.reputation.toFixed(1)}` + (snap.day ? ` · Ngày ${snap.day}` : ""), 16, 72);
  text("Tay: " + (snap.hand ? dn(snap.hand.dish_id) + " (" + snap.hand.order_id + ")" : "trống"), w - 16, 34, { align: "right", color: "#f4c430" });
  const held = {}; (snap.customers || []).forEach((c) => Object.entries(c.reserved || {}).forEach(([k, v]) => (held[k] = (held[k] || 0) + v)));
  const avail = {}; Object.keys(snap.stock || {}).forEach((k) => (avail[k] = snap.stock[k] - (held[k] || 0)));
  text("Kho khả dụng: " + items(avail), w - 16, 72, { align: "right" });
  // bảng đơn từng bàn
  const px0 = w - 350; panel(px0, top, 340, 40 + 34 * (snap.tables || []).length);
  text("Đơn tại bàn", px0 + 12, top + 28, { bold: true });
  (snap.tables || []).forEach((tb, i) => {
    const c = byTable[tb.id], y = top + 62 + i * 34;
    if (!c) { text(`${tb.id}: trống`, px0 + 12, y, { color: "#cdbfa6" }); return; }
    const frac = c.patience_ticks_left / patMax;
    const st = c.state === "eating" ? "đang ăn" : c.order_status === "assigned" ? "đang nấu" : Math.ceil(c.patience_ticks_left / 60) + "s";
    text(`${tb.id}: ${dn(c.dish_id)} · ${st}`, px0 + 12, y, { color: c.state === "waiting" && frac < 0.25 ? "#ff5a5f" : "#fff7e8" });
  });
  text("WASD đi · E nấu / lấy món / phục vụ · Esc tạm dừng", w - 16, h - 14, { align: "right", color: "#cdbfa6" });
}

// ---------- SHOP ----------
function drawShop(w, h) {
  const shop = (snap.meta || {}).shop || { upgrades: {} };
  panel(w / 2 - 330, 90, 660, 430, 0.9);
  text("Tiệm của Chú Ba — nâng cấp cho lần lặn sau", w / 2, 132, { align: "center", size: 26, bold: true, color: "#f4c430" });
  text(`Tiền: ${snap.money}k · tự đóng sau ${Math.ceil(snap.time_left_ticks / 60)}s`, w / 2, 168, { align: "center" });
  ["oxygen", "hp"].forEach((k, i) => {
    const lv = (snap.upgrades || {})[k] || 0, act = (snap.active_upgrades || {})[k] || 0, lvls = shop.upgrades[k] || [];
    const nxt = lvls[lv], y = 240 + i * 90;
    text(`[${i + 1}] ${UPG[k][0]} — cấp ${lv}/${lvls.length}` + (act !== lv ? " (áp dụng từ Ngày sau)" : ""), w / 2 - 300, y, { size: 22, bold: true });
    text(nxt ? `Cấp ${nxt.level}: ${nxt[UPG[k][1]]}${UPG[k][2]} — giá ${nxt.price}k` + (snap.money < nxt.price ? " (thiếu tiền)" : "") : "Đã tối đa",
      w / 2 - 300, y + 32, { color: nxt && snap.money >= nxt.price ? "#5bbf6a" : "#cdbfa6" });
  });
  text("Kho dư từ ca (sẽ bỏ): " + items(snap.stock), w / 2, 440, { align: "center", color: "#cdbfa6" });
  text("1 / 2 mua · Enter: đóng Shop, sang Ngày mới · Esc tạm dừng", w / 2, 495, { align: "center" });
  const ev = (snap.events || []).filter((e) => e.name === "bought" || e.name === "buy_failed").slice(-1)[0];
  if (ev && ev.day === snap.day) text(ev.name === "bought" ? `Đã mua ${UPG[ev.data.upgrade][0]} cấp ${ev.data.level}` : `Không mua được (${{ funds: "thiếu tiền", max_level: "đã tối đa", unknown: "không hỗ trợ" }[ev.data.reason] || ev.data.reason})`,
    w / 2, 204, { align: "center", color: ev.name === "bought" ? "#5bbf6a" : "#ff5a5f" });
}

// ---------- màn hình ----------
function screenBox(w, h, title, lines, foot) {
  ctx.fillStyle = "rgba(10,14,20,.86)"; ctx.fillRect(0, 0, w, h);
  panel(w / 2 - 380, h / 2 - 210, 760, 420, 0.95);
  text(title, w / 2, h / 2 - 150, { align: "center", size: 32, bold: true, color: "#f4c430" });
  lines.forEach((l, i) => text(l, w / 2, h / 2 - 90 + i * 34, { align: "center" }));
  if (foot) text(foot, w / 2, h / 2 + 180, { align: "center", color: "#cdbfa6" });
}
function drawScreens(w, h) {
  const u = ui(), st = u.stats || { days: [], dishes: {} }, ds = st.days.slice(-1)[0] || {};
  if (u.screen === "menu") {
    ctx.fillStyle = "#1b2a4a"; ctx.fillRect(0, 0, w, h);
    text("Quán Ăn Chợ Nổi", w / 2, h / 2 - 120, { align: "center", size: 48, bold: true, color: "#f4c430" });
    text("Út Sen lặn bắt cá, hái rau, tối mở quán trên nhà bè của Má Tư", w / 2, h / 2 - 70, { align: "center", color: "#cdbfa6" });
    ["Chơi", "Thoát"].forEach((t, i) => text((menuSel === i ? "▶ " : "  ") + t, w / 2, h / 2 + i * 50, { align: "center", size: 30, bold: menuSel === i }));
    text("↑/↓ chọn · Enter xác nhận", w / 2, h / 2 + 140, { align: "center", color: "#cdbfa6" });
  } else if (u.screen === "day_intro" && snap.day_plan) {
    const pl = snap.day_plan;
    screenBox(w, h, `Ngày ${snap.day}`, ["Má Tư: \"Bữa nay má tính nấu mấy món nầy nghen con:\"",
      ...Object.keys(pl.dishes).map((d) => `• ${dn(d)} × ${pl.dishes[d]}`), "Cần lấy: " + items(pl.ingredients)],
      `Tự qua sau ${Math.max(0, 4 - u.elapsed).toFixed(0)}s hoặc nhấn phím bất kỳ`);
  } else if (u.screen === "evening_intro") {
    const menu = (snap.meta || {}).menu || {}, plan = snap.day_plan ? Object.keys(snap.day_plan.dishes) : Object.keys(menu);
    const can = plan.filter((d) => Object.entries(menu[d].recipe).every(([k, v]) => (snap.stock[k] || 0) >= v));
    screenBox(w, h, "Chiều tối — mở quán", ["Nhập kho: " + items(ds.inventory || snap.stock),
      "Món nấu được: " + (can.map(dn).join(", ") || "chưa đủ nguyên liệu món nào")], "Nhấn phím bất kỳ để mở quán");
  } else if (u.screen === "day_result") {
    const dr = (ds.rep_end - ds.rep_start) || 0;
    screenBox(w, h, `Kết quả Ngày ${snap.day}`, [`Khách đã phục vụ: ${ds.served} · bỏ đi: ${ds.left}`,
      `Tiền ca: ${ds.shift_money}k (boa ${ds.tips}k)`, `Uy tín: ${dr >= 0 ? "+" : ""}${dr.toFixed(1)} → ${snap.reputation.toFixed(1)}`,
      `Tổng tiền: ${snap.money}k · điểm ${snap.score}`], "Nhấn phím bất kỳ để vào Shop");
  } else if (u.screen === "summary") {
    const best = Object.entries(st.dishes).sort((a, b) => b[1] - a[1])[0];
    screenBox(w, h, "Tổng kết", [`Tổng tiền: ${snap.money}k · tổng thu ${snap.earned}k`, `Tổng điểm: ${snap.score}`,
      `Uy tín: ${snap.reputation.toFixed(1)}`, "Món bán chạy: " + (best ? `${dn(best[0])} (${best[1]} suất)` : "chưa bán được món nào")],
      "R / Enter: chơi lại");
  }
}
function drawPause(w, h) {
  ctx.fillStyle = "rgba(10,14,20,.7)"; ctx.fillRect(0, 0, w, h);
  panel(w / 2 - 200, h / 2 - 110, 400, 220, 0.95);
  text("Tạm dừng", w / 2, h / 2 - 50, { align: "center", size: 32, bold: true, color: "#f4c430" });
  ["Tiếp tục", "Về menu"].forEach((t, i) => text((pauseSel === i ? "▶ " : "  ") + t, w / 2, h / 2 + i * 44, { align: "center", size: 24, bold: pauseSel === i }));
  text("Esc/P tiếp tục · M về menu", w / 2, h / 2 + 96, { align: "center", color: "#cdbfa6" });
}
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (quit) { text("Đã thoát. Có thể đóng tab này.", w / 2, h / 2, { align: "center", size: 24 }); return; }
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center" }); return; }
  const ph = phase();
  if (ph === "quan") drawQuan(w, h); else if (ph === "shop") drawShop(w, h); else drawGather(w, h);
  if (snap.state === "paused") drawPause(w, h);
  drawScreens(w, h);
  if (offline) text("Mất kết nối tới máy chủ", w / 2, 120, { align: "center", color: "#ff8a80" });
  if (snap.error) text("Luật báo lỗi — xem terminal.", w / 2, 150, { align: "center", color: "#ff8a80" });
  if (snap.finished && snap.mode !== "day") text("Buổi kết thúc: " + (snap.reason || "") + " · R chơi lại", w / 2, h / 2, { align: "center", size: 26, bold: true });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
